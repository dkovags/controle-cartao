// Grava só se ninguém alterou o documento desde a última leitura (rev); senão lança "conflict"
async function saveTx(next,baseRev,changes,who){
  const fdb=initFB();const ref=fdb.doc(DOC_PATH);
  return fdb.runTransaction(async t=>{
    const s=await t.get(ref);const cur=s.exists?(s.data().rev||0):0;
    if(cur!==baseRev){const e=new Error("conflict");e.code="conflict";throw e;}
    const hist=s.exists?(pJ(s.data().history)||[]):[];const now=new Date().toISOString();
    if(changes.length)hist.push({ts:now,user:who,changes:[...changes],...(changes.refs?.some(Boolean)?{refs:changes.refs}:{})});
    while(hist.length>500)hist.shift();
    t.set(ref,{purchases:JSON.stringify(next.purchases),people:JSON.stringify(next.people),baixas:JSON.stringify(next.baixas),incOk:JSON.stringify(next.incOk||{}),corr:JSON.stringify(next.corr||{}),ajustes:JSON.stringify(next.ajustes||{}),updatedAt:now,rev:cur+1,history:JSON.stringify(hist)});
    return{rev:cur+1,now,hist};
  });
}

// Descreve em português o que mudou entre duas versões dos dados (para o histórico)
function diffData(a,b){
  // refs: a que registro cada linha se refere (c:<id da compra>, b:<mês>|<data>|<valor>), para o histórico por transação
  const out=[];const refs=[];out.refs=refs;const add=(t,r)=>{out.push(t);refs.push(r||null);};const pd=p=>`${p.loja} (${fD(p.data)})`;
  const bref=(m,x)=>`b:${m}|${x.date}|${x.amount}`;
  const A=new Map(a.purchases.map(p=>[p.id,p])),B=new Map(b.purchases.map(p=>[p.id,p]));
  B.forEach((p,id)=>{if(!A.has(id))add(`Nova compra: ${pd(p)} – ${fB(p.total)} em ${p.parcelas}x${p.anexos?.length?" (com comprovante)":""}`,["c:"+id]);});
  A.forEach((p,id)=>{if(!B.has(id))add(`Compra excluída: ${pd(p)} – ${fB(p.total)} em ${p.parcelas}x`,["c:"+id]);});
  B.forEach((p,id)=>{const o=A.get(id);if(!o||JSON.stringify(o)===JSON.stringify(p))return;const f=[];
    if(o.loja!==p.loja)f.push(`loja ${o.loja} → ${p.loja}`);
    if(o.data!==p.data)f.push(`data ${fD(o.data)} → ${fD(p.data)}`);
    if(o.total!==p.total)f.push(`total ${fB(o.total)} → ${fB(p.total)}`);
    if(o.parcelas!==p.parcelas)f.push(`parcelas ${o.parcelas} → ${p.parcelas}`);
    if(JSON.stringify(o.monthly)!==JSON.stringify(p.monthly))f.push(`meses: ${Object.keys(o.monthly).length} → ${Object.keys(p.monthly).length}`);
    if((p.anexos||[]).length>(o.anexos||[]).length)f.push("comprovante anexado");
    add(`Compra alterada: ${pd(o)}${f.length?" – "+f.join("; "):""}`,["c:"+id]);});
  const bk=x=>`${fB(x.amount)} (${fD(x.date)})${x.anexos?.length?" com comprovante":""}`;
  new Set([...Object.keys(a.baixas),...Object.keys(b.baixas)]).forEach(m=>{
    const o=a.baixas[m]||[],n=b.baixas[m]||[];if(JSON.stringify(o)===JSON.stringify(n))return;
    if(o.length===n.length){n.forEach((x,i)=>{if(JSON.stringify(x)!==JSON.stringify(o[i]))add(`Baixa alterada em ${m}: ${bk(o[i])} → ${bk(x)}`,[bref(m,x),bref(m,o[i])]);});return;}
    const cnt={};o.forEach(x=>{const k=JSON.stringify(x);cnt[k]=(cnt[k]||0)+1;});
    n.forEach(x=>{const k=JSON.stringify(x);if(cnt[k])cnt[k]--;else add(`Nova baixa em ${m}: ${bk(x)}`,[bref(m,x)]);});
    Object.entries(cnt).forEach(([k,c])=>{for(let i=0;i<c;i++)add(`Baixa excluída em ${m}: ${bk(JSON.parse(k))}`,[bref(m,JSON.parse(k))]);});
  });
  const ia=a.incOk||{},ib=b.incOk||{};
  Object.keys(ib).forEach(k=>{if(!ia[k])add(`Inconsistência marcada como tratada: ${ib[k].label||k}`);});
  Object.keys(ia).forEach(k=>{if(!ib[k])add(`Inconsistência reaberta: ${ia[k].label||k}`);});
  const ja=a.ajustes||{},jb=b.ajustes||{};new Set([...Object.keys(ja),...Object.keys(jb)]).forEach(m=>{const ka=new Set((ja[m]||[]).map(x=>x.key)),kb=new Set((jb[m]||[]).map(x=>x.key));(jb[m]||[]).forEach(x=>{if(!ka.has(x.key))add(`Ajuste lançado em ${m}: ${x.desc} – ${x.valor>=0?"+":"−"} ${fB(Math.abs(x.valor))}`);});(ja[m]||[]).forEach(x=>{if(!kb.has(x.key))add(`Ajuste removido de ${m}: ${x.desc} – ${x.valor>=0?"+":"−"} ${fB(Math.abs(x.valor))}`);});});
  const ca=a.corr||{},cb=b.corr||{};Object.keys(cb).forEach(k=>{if(!ca[k])(t=>{out.unshift(t);refs.unshift(null);})(cb[k].status==="aplicada"?`Correção aplicada: ${cb[k].titulo} (preparada pelo Claude)`:`Correção recusada: ${cb[k].titulo} (preparada pelo Claude)`);});
  new Set([...Object.keys(a.people),...Object.keys(b.people)]).forEach(n=>{if(JSON.stringify(a.people[n])!==JSON.stringify(b.people[n]))add(`Terceiros alterados: ${n}`);});
  return out;
}
// Operações (inclusão/alteração/exclusão) com valor, para a notificação por e-mail
function opsData(a,b){
  const ops=[];const A=new Map(a.purchases.map(p=>[p.id,p])),B=new Map(b.purchases.map(p=>[p.id,p]));const pd=p=>`${p.loja} (${fD(p.data)}) em ${p.parcelas}x`;
  B.forEach((p,id)=>{const o=A.get(id);if(!o)ops.push({acao:"Inclusão",tipo:"compra",desc:pd(p),valor:p.total,anexo:!!p.anexos?.length});else if(JSON.stringify(o)!==JSON.stringify(p))ops.push({acao:"Alteração",tipo:"compra",desc:pd(p),valor:p.total,anterior:o.total!==p.total?o.total:null,anexo:(p.anexos||[]).length>(o.anexos||[]).length});});
  A.forEach((p,id)=>{if(!B.has(id))ops.push({acao:"Exclusão",tipo:"compra",desc:pd(p),valor:p.total});});
  new Set([...Object.keys(a.baixas),...Object.keys(b.baixas)]).forEach(m=>{const o=a.baixas[m]||[],n=b.baixas[m]||[];if(JSON.stringify(o)===JSON.stringify(n))return;
    const bd=x=>`Fatura ${m}, pago em ${fD(x.date)}`;
    if(o.length===n.length){n.forEach((x,i)=>{if(JSON.stringify(x)!==JSON.stringify(o[i]))ops.push({acao:"Alteração",tipo:"baixa",desc:bd(x),valor:x.amount,anterior:o[i].amount!==x.amount?o[i].amount:null,anexo:(x.anexos||[]).length>(o[i].anexos||[]).length});});return;}
    const cnt={};o.forEach(x=>{const k=JSON.stringify(x);cnt[k]=(cnt[k]||0)+1;});
    n.forEach(x=>{const k=JSON.stringify(x);if(cnt[k])cnt[k]--;else ops.push({acao:"Inclusão",tipo:"baixa",desc:bd(x),valor:x.amount,anexo:!!x.anexos?.length});});
    Object.entries(cnt).forEach(([k,c])=>{for(let i=0;i<c;i++){const x=JSON.parse(k);ops.push({acao:"Exclusão",tipo:"baixa",desc:bd(x),valor:x.amount});}});});

}

function exportXLSX(ps,baixas,ppl,mt){
  if(typeof XLSX==="undefined"){alert("Biblioteca de exportação não carregada. Recarregue a página.");return;}
  const wb=XLSX.utils.book_new();

  // Collect all months that appear in any purchase
  const allMonths=[];
  const mSet=new Set();
  ps.forEach(p=>Object.keys(p.monthly).forEach(m=>mSet.add(m)));
  MO.forEach(m=>{if(mSet.has(m))allMonths.push(m);});

  // Aba Compras - header fixo com todos os meses
  const comprasHeader=["ID","Data","Loja","Total","Parcelas","Valor Parcela",...allMonths];
  const comprasRows=[comprasHeader];
  ps.forEach(p=>{
    const vp=Math.round((p.total/(p.parcelas||1))*100)/100;
    const row=[p.id,fD(p.data),p.loja,p.total,p.parcelas,vp];
    allMonths.forEach(m=>{row.push(p.monthly[m]||"");});
    comprasRows.push(row);
  });
  const wsC=XLSX.utils.aoa_to_sheet(comprasRows);
  XLSX.utils.book_append_sheet(wb,wsC,"Compras");

  // Aba Baixas - todos os meses com baixas
  const baixasRows=[["Mês","#","Valor","Data"]];
  MO.forEach(m=>{
    const list=baixas[m]||[];
    list.forEach((b,i)=>{baixasRows.push([m,i+1,b.amount,b.date?fD(b.date):"—"]);});
  });
  if(baixasRows.length>1){const wsB=XLSX.utils.aoa_to_sheet(baixasRows);XLSX.utils.book_append_sheet(wb,wsB,"Baixas");}

  // Aba Resumo Mensal - provisão, baixas, saldo mês, saldo acum por mês
  const resumoRows=[["Mês","Provisão","Baixas","Saldo Mês","Saldo Acum."]];
  const lastSeedM="Fevereiro/2026";const lsi=MO.indexOf(lastSeedM);
  let runAcum=0;
  MO.forEach((m,i)=>{
    const prov=mt[m]||0;
    const bxTotal=(baixas[m]||[]).reduce((s,b)=>s+b.amount,0);
    if(prov===0&&bxTotal===0)return;
    const saldoM=bxTotal-prov;
    if(SEED_ACUM[m]!==undefined){runAcum=SEED_ACUM[m];}
    else if(i>lsi){runAcum+=saldoM;}
    resumoRows.push([m,prov,bxTotal,Math.round(saldoM*100)/100,Math.round(runAcum*100)/100]);
  });
  if(resumoRows.length>1){const wsR=XLSX.utils.aoa_to_sheet(resumoRows);XLSX.utils.book_append_sheet(wb,wsR,"Resumo Mensal");}

  // Aba Terceiros
  const terRows=[["Pessoa","Item","Total Item","Mês","Valor Pago","Data Pgto","Restante"]];
  Object.entries(ppl).forEach(([nome,itens])=>{
    itens.forEach(it=>{
      it.payments.forEach(pay=>{terRows.push([nome,it.item,it.total,pay.month,pay.amount,pay.date?fD(pay.date):"—",it.remaining]);});
    });
  });
  if(terRows.length>1){const wsT=XLSX.utils.aoa_to_sheet(terRows);XLSX.utils.book_append_sheet(wb,wsT,"Terceiros");}

  const hoje=new Date();const ts=`${String(hoje.getDate()).padStart(2,"0")}${String(hoje.getMonth()+1).padStart(2,"0")}${hoje.getFullYear()}`;
  XLSX.writeFile(wb,`CPC_Export_${ts}.xlsx`);
}

    </div>)}
  </ReportDoc>);

// Verificações de consistência dos dados
const mIdx=m=>MO.indexOf(m);
const nrm=s=>s.normalize("NFD").replace(/[̀-ͯ]/g,"").toLowerCase().replace(/[^a-z0-9 ]/g," ").split(/\s+/).filter(w=>w&&!["de","da","das","do","dos","e"].includes(w));
// Parecidos: todas as palavras (2+ letras) de um nome aparecem no outro, inteiras ou abreviadas, com ao menos uma de 3+ letras
function similarNames(a,b){const A=nrm(a).filter(w=>w.length>=2),B=nrm(b).filter(w=>w.length>=2);if(!A.length||!B.length)return false;const sub=(s,l)=>s.every(w=>l.some(x=>x===w||x.startsWith(w)))&&s.some(w=>w.length>=3);return sub(A,B)||sub(B,A);}
function findIncons(ps,baixas){
  const out=[];const add=(sev,cat,title,detail,kp)=>out.push({sev,cat,title,detail,key:cat+"|"+kp});
  ps.forEach(p=>{
    const k=Object.keys(p.monthly||{}).sort((a,b)=>mIdx(a)-mIdx(b));const vals=k.map(m=>p.monthly[m]);const n=k.length;
    const soma=Math.round(vals.reduce((s,v)=>s+v,0)*100)/100;const lbl=`${p.loja} (${fD(p.data)}) – id ${p.id}`;
    // entrada + parcelas iguais (ex.: Iphone): não é inconsistência
    const entrada=n===p.parcelas+1&&Math.abs(soma-p.total)<=0.1&&vals.slice(1).every(v=>v===vals[1])&&vals[0]!==vals[1];
    // Parcelas × meses já explica a diferença de soma: uma compra gera um só erro
    if(!entrada&&n!==p.parcelas)add("Erro","Parcelas × meses lançados",lbl,`${p.parcelas} parcelas, mas ${n} meses lançados (${k.join(", ")}). Meses somam ${fB(soma)}; total da compra ${fB(p.total)}.`,"p"+p.id);
    else if(!entrada&&Math.abs(soma-p.total)>Math.max(.05,.01*n))add("Erro","Soma das parcelas × total",lbl,`Meses somam ${fB(soma)}; total da compra ${fB(p.total)} (diferença ${fB(Math.abs(soma-p.total))}).`,"p"+p.id);
    if(k.some((m,i)=>i&&mIdx(m)-mIdx(k[i-1])!==1))add("Erro","Meses fora de sequência",lbl,`Meses lançados: ${k.join(", ")}.`,"p"+p.id);
    if(vals.some(v=>!(v>0)))add("Erro","Valor inválido",lbl,"Há parcela com valor zero ou negativo.","p"+p.id);
    if(!p.data)add("Atenção","Compra sem data",lbl,`Primeiro mês lançado: ${k[0]||"—"}.`,"p"+p.id);
    else if(!dKey(p))add("Erro","Data da compra inválida",lbl,`Data registrada: "${p.data}".`,"p"+p.id);
  });
  Object.keys(baixas).sort((a,b)=>mIdx(a)-mIdx(b)).forEach(m=>{
    const mi=mIdx(m);const seen={};
    (baixas[m]||[]).forEach((b,i)=>{
      const lbl=`Baixa ${i+1} de ${m}`;const bk=`${m}|${b.date}|${b.amount}`;const d=/^(\d{2})\/(\d{2})\/(\d{4})$/.exec(b.date||"");
      if(!(b.amount>0))add("Erro","Valor inválido",lbl,`Valor: ${fB(b.amount)}.`,bk);
      if(!d)add("Erro","Data de baixa inválida",lbl,`Data registrada: "${b.date}".`,bk);
      else{const j=mIdx(`${MN[+d[2]-1]}/${d[3]}`);if(j!==mi&&j!==mi-1)add("Erro","Baixa fora do período da fatura",lbl,`${fB(b.amount)} pago em ${b.date}; esperado entre o mês anterior e ${m}.`,bk);}
      const key=b.amount+"|"+b.date;seen[key]=(seen[key]||0)+1;if(seen[key]===2)add("Atenção","Possível baixa duplicada",`Baixas de ${m}`,`Mais de uma baixa de ${fB(b.amount)} em ${fD(b.date)}. Confirme se foram pagamentos distintos.`,bk);
    });
  });
  const names=[...new Set(ps.map(p=>p.loja))].sort();const used=new Set();
  names.forEach(a=>{if(used.has(a))return;const g=names.filter(b=>b!==a&&!used.has(b)&&similarNames(a,b));if(g.length){[a,...g].forEach(x=>used.add(x));add("Atenção","Nomes de loja parecidos",[a,...g].join(" / "),"Podem ser a mesma loja escrita de formas diferentes.",[a,...g].join("/"));}});
  return[...out.filter(i=>i.sev==="Erro"),...out.filter(i=>i.sev!=="Erro")];
}
// Análise automática de cada inconsistência: o que provavelmente ocorreu e o que fazer
function explainIncon(it,ps,baixas){
  const kp=it.key.slice(it.cat.length+1);const r2=v=>Math.round(v*100)/100;
  const prov=m=>r2(ps.reduce((s,p)=>s+(p.monthly[m]||0),0));const pago=m=>r2((baixas[m]||[]).reduce((s,b)=>s+b.amount,0));
  const nxt=(m,k)=>MO[mIdx(m)+k];const lst=a=>a.length>1?a.slice(0,-1).join(", ")+" e "+a[a.length-1]:a[0]||"";
  const P=kp.startsWith("p")?ps.find(p=>String(p.id)===kp.slice(1)):null;
  if(P){
    const k=Object.keys(P.monthly).sort((a,b)=>mIdx(a)-mIdx(b));const n=k.length;const vals=k.map(m=>P.monthly[m]);const soma=r2(vals.reduce((s,v)=>s+v,0));
    const vp=r2(P.total/(P.parcelas||1));const out=[];
    const irmas=ps.filter(x=>x.id!==P.id&&x.loja===P.loja);
    const moda=(()=>{const c={};irmas.forEach(x=>{c[x.parcelas]=(c[x.parcelas]||0)+1;});const e=Object.entries(c).sort((a,b)=>b[1]-a[1])[0];return e&&e[1]>=2?{n:+e[0],q:e[1]}:null;})();
    const mesmoDia=irmas.filter(x=>x.data&&x.data===P.data);
    if(it.cat==="Parcelas × meses lançados"||it.cat==="Soma das parcelas × total"){
      if(n<P.parcelas){
        const falt=[];for(let i=1;i<=P.parcelas-n;i++)falt.push(nxt(k[n-1],i));
        out.push(`Foram lançadas ${n} de ${P.parcelas} parcelas. ${falt.length>1?"Faltam":"Falta"} ${falt.length} parcela${falt.length>1?"s":""} de ${fB(vp)}, que ${falt.length>1?"cairiam":"cairia"} em ${lst(falt)}; por isso os meses somam ${fB(soma)} e não ${fB(P.total)}.`);
        falt.forEach(m=>{const sd=r2(pago(m)-prov(m));out.push(sd>=vp-1?`Em ${m} as baixas superam a provisão em ${fB(sd)}, o que é compatível com essa parcela ter sido cobrada e paga.`:`Em ${m} as baixas ${sd>=0?`superam a provisão em só ${fB(sd)}`:`ficaram ${fB(-sd)} abaixo da provisão`}, o que não indica pagamento dessa parcela.`);});
        if(moda)out.push(`As demais compras nesta loja costumam ser em ${moda.n}x (${moda.q} compras)${moda.n===P.parcelas?", o que reforça que faltou lançar":""}.`);
        out.push(`O que fazer: confira a fatura de ${lst(falt)}. Se a parcela aparece, lance-a; se não, ajuste a compra para ${n} parcelas com total de ${fB(soma)}.`);
      }else if(n>P.parcelas){
        const ent=n===P.parcelas+1&&vals.slice(1).every(v=>v===vals[1])&&vals[0]!==vals[1];
        const extra=k.slice(P.parcelas);
        out.push(`Há ${n} meses lançados para ${P.parcelas} parcelas: ${extra.length>1?"os meses":"o mês"} ${lst(extra)} ${extra.length>1?"excedem":"excede"} o parcelamento, somando ${fB(soma)} contra um total de ${fB(P.total)}.`);
        if(Math.abs(P.parcelas*vals[0]-P.total)<=.1&&!ent)out.push(`O total registrado corresponde exatamente a ${P.parcelas} × ${fB(vals[0])}, o que sugere lançamento a mais.`);
        extra.forEach(m=>{const sd=r2(pago(m)-prov(m));if(Math.abs(sd)<.01)out.push(`Por outro lado, as baixas de ${m} fecham exatamente com a provisão contando essa parcela. Isso pode indicar que ela foi cobrada, ou apenas que o pagamento seguiu o valor mostrado pelo sistema.`);});
        if(mesmoDia.length)out.push(`No mesmo dia há outra compra nesta loja (${mesmoDia.map(x=>`${fB(x.total)} em ${x.parcelas}x`).join("; ")}); vale conferir se não houve troca entre elas.`);
        out.push(`O que fazer: confira a fatura de ${lst(extra)}. Se a parcela não aparece, retire ${extra.length>1?"esses meses":"esse mês"}; se aparece, ajuste para ${n} parcelas com total de ${fB(soma)}.`);
      }else{
        out.push(`O número de parcelas confere, mas os valores mensais somam ${fB(soma)} em vez de ${fB(P.total)} (diferença de ${fB(Math.abs(soma-P.total))}). Provável erro de digitação no total ou em algum valor mensal.`);
      }
      return out.join(" ");
    }
    if(it.cat==="Meses fora de sequência"){const gaps=[];k.forEach((m,i)=>{if(i)for(let j=mIdx(k[i-1])+1;j<mIdx(m);j++)gaps.push(MO[j]);});return`A sequência de parcelas pula ${lst(gaps)}. Normalmente as parcelas caem em meses seguidos; provavelmente uma parcela foi lançada no mês errado. O que fazer: confira na fatura em que meses as parcelas foram cobradas.`;}
    if(it.cat==="Valor inválido")return"Há parcela com valor zero ou negativo, o que não ocorre numa compra parcelada. Provável erro de digitação; corrija o valor ou exclua o mês.";
    if(it.cat==="Compra sem data"){const f=k[0];const q=pmk(f);const pm=q.month?q.month:12,py=q.month?q.year:q.year-1;const d2=x=>String(x).padStart(2,"0");return`Lançamento antigo, importado da planilha, sem a data da compra. Pela regra de fechamento (dia 19), a primeira parcela em ${f} indica compra feita aproximadamente entre 19/${d2(pm)}/${py} e 18/${d2(q.month+1)}/${q.year}. Não afeta os valores; se tiver o comprovante, informe a data, ou marque como tratada.`;}
    if(it.cat==="Data da compra inválida")return`A data "${P.data}" não está no formato dd/mm/aaaa (provável erro de digitação, como barra faltando). Não afeta os valores, mas atrapalha a ordenação. O que fazer: corrija a data na compra.`;
  }
  const bm=/^(.+?\/\d{4})\|(.*)\|(-?[\d.]+)$/.exec(kp);
  if(bm){const[,m,date,amt]=bm;const v=+amt;
    if(it.cat==="Possível baixa duplicada"){const q=(baixas[m]||[]).filter(b=>b.date===date&&b.amount===v).length;const sd=r2(pago(m)-prov(m));
      return`Há ${q} baixas de ${fB(v)} em ${fD(date)} na fatura de ${m}. As baixas do mês somam ${fB(pago(m))} para uma provisão de ${fB(prov(m))} (${sd>=0?`excedente de ${fB(sd)}`:`faltam ${fB(-sd)}`}). ${sd>=v-.01?`Como o excedente cobre um desses pagamentos, é provável que um deles esteja repetido.`:`Como o mês não ficou com excedente desse valor, provavelmente foram dois pagamentos distintos no mesmo dia.`} O que fazer: confira no extrato e exclua a repetida, ou marque como tratada.`;}
    if(it.cat==="Baixa fora do período da fatura"){const d=date.split("/");const inv=`${d[1]}/${d[0]}/${d[2]}`;const ok=x=>{const p=x.split("/");const j=mIdx(`${MN[+p[1]-1]}/${p[2]}`);return j===mIdx(m)||j===mIdx(m)-1;};
      const sug=(+d[1]<=12&&+d[0]<=12&&ok(inv))?`Com dia e mês invertidos (${inv}) a data cairia no período, então é provável inversão.`:ok(`${d[0]}/${d[1]}/${+d[2]-1}`)?`Com o ano anterior (${d[0]}/${d[1]}/${+d[2]-1}) a data cairia no período, então é provável erro no ano.`:"Pode ter sido lançada na fatura errada.";
      return`O pagamento de ${fB(v)} em ${date} está fora do período usual da fatura de ${m} (mês anterior ou o próprio mês). ${sug} O que fazer: corrija a data ou mova a baixa para a fatura certa.`;}
    if(it.cat==="Data de baixa inválida")return`A data "${date}" não está no formato dd/mm/aaaa. Provável erro de digitação; corrija a data da baixa.`;
    if(it.cat==="Valor inválido")return`Baixa com valor ${fB(v)}, o que não representa um pagamento. Corrija o valor ou exclua a baixa.`;
  }
  if(it.cat==="Nomes de loja parecidos"){const ns=kp.split("/");return`Nomes encontrados: ${ns.map(x=>`${x} (${ps.filter(p=>p.loja===x).length} compra${ps.filter(p=>p.loja===x).length!==1?"s":""})`).join(", ")}. Se forem a mesma loja, unifique o nome para os relatórios e o ranking somarem corretamente; se não, marque como tratada.`;}
  return"";
}
// Impacto em valor: v>0 pago a mais, v<0 pago a menos (null quando não se aplica)
function impactIncon(it,ps,baixas){
  const kp=it.key.slice(it.cat.length+1);const r2=v=>Math.round(v*100)/100;
  if(kp.startsWith("p")&&(it.cat==="Parcelas × meses lançados"||it.cat==="Soma das parcelas × total")){
    const P=ps.find(p=>String(p.id)===kp.slice(1));if(!P)return null;const soma=r2(Object.values(P.monthly).reduce((s,v)=>s+v,0));const d=r2(soma-P.total);
    return d?{v:d,ref:`p${P.id}`,txt:d>0?`Lançado ${fB(d)} além do total da compra`:`Faltou lançar ${fB(-d)} do total da compra`}:null;
  }
  const bm=/^(.+?\/\d{4})\|/.exec(kp);
  if(bm&&it.cat==="Possível baixa duplicada"){const m=bm[1];const pv=r2(ps.reduce((s,p)=>s+(p.monthly[m]||0),0));const pg=r2((baixas[m]||[]).reduce((s,b)=>s+b.amount,0));const d=r2(pg-pv);
    return Math.abs(d)>=.01?{v:d,ref:`m${m}`,txt:`Saldo de ${m}: pago ${fB(pg)} para provisão de ${fB(pv)}`}:null;}
  return null;
}
// Competência do relatório de inconsistências: do mês mais antigo ao mais recente envolvido
function compInc(items,ps){const ms=[];items.forEach(i=>{const kp=i.key.slice(i.cat.length+1);const m=/^(.+?\/\d{4})\|/.exec(kp);if(m)ms.push(m[1]);const P=kp.startsWith("p")&&ps.find(p=>String(p.id)===kp.slice(1));if(P)ms.push(...Object.keys(P.monthly));});
  return ms.length?(()=>{const s=[...new Set(ms)].sort((a,b)=>mIdx(a)-mIdx(b));return s.length>1?`${s[0]} a ${s[s.length-1]}`:s[0];})():"Todos os meses";}
const vCor=v=>v>0?"#0a7d3c":"#c62828";
function IncSheet({items,ps,baixas}){
  const cats=[...new Set(items.map(i=>i.cat))];
  // consolidação: cada compra/mês conta uma vez
  const imp={};items.forEach(i=>{const x=impactIncon(i,ps,baixas);if(x&&!imp[x.ref])imp[x.ref]=x;});
  const vals=Object.values(imp);const mais=vals.filter(x=>x.v>0).reduce((s,x)=>s+x.v,0),menos=vals.filter(x=>x.v<0).reduce((s,x)=>s-x.v,0);
  const semOQF=t=>t.replace(/\s*O que fazer:.*$/,"");
  return(<ReportDoc title="Relatório de Inconsistências" comp={compInc(items,ps)}>
    {!items.length&&<div style={{fontSize:12}}>Nenhuma inconsistência encontrada.</div>}
    {items.length>0&&<div style={{fontSize:11,color:"#333",marginBottom:12}}>{items.filter(i=>i.sev==="Erro").length} erro(s) e {items.filter(i=>i.sev==="Atenção").length} ponto(s) de atenção.</div>}
    {cats.map(c=>{const l=items.filter(i=>i.cat===c);return(<div key={c} style={{marginBottom:16}}>
      <div style={{fontSize:13,fontWeight:700,marginBottom:4}}>{c} <span style={{fontWeight:400,color:"#555"}}>({l.length}) – {l[0].sev}</span></div>
      <table style={{width:"100%",borderCollapse:"collapse"}}><tbody>{l.map((i,k)=>{const ex=semOQF(explainIncon(i,ps,baixas));const x=impactIncon(i,ps,baixas);return(<tr key={k} style={{breakInside:"avoid"}}>
        <td style={{...pTd,width:"30%",fontWeight:600}}>{i.title}</td>
        <td style={pTd}>{i.detail}{ex&&<div style={{marginTop:5,padding:"6px 8px",background:"#f4f1fb",borderLeft:"3px solid #7c3aed",fontSize:10.5,lineHeight:1.45,color:"#222"}}><b>Análise automática:</b> {ex}</div>}</td>
        <td style={{...pTd,...pR,width:"17%"}}>{x?(<><div style={{fontWeight:700,color:vCor(x.v)}}>{x.v>0?"+":"−"} {fB(Math.abs(x.v))}</div><div style={{fontSize:9,color:vCor(x.v)}}>{x.v>0?"pago a mais":"pago a menos"}</div></>):<span style={{color:"#999"}}>—</span>}</td>
      </tr>);})}</tbody></table>
    </div>);})}
    {items.length>0&&(<div style={{marginTop:8,breakInside:"avoid"}}>
      <div style={{fontSize:13,fontWeight:700,marginBottom:4,borderTop:"2px solid #111",paddingTop:10}}>Consolidação dos valores</div>
      <div style={{fontSize:10,color:"#555",marginBottom:6}}>Cada compra e cada mês entram uma única vez, mesmo que apareçam em mais de uma inconsistência.</div>
      <table style={{marginLeft:"auto",borderCollapse:"collapse",fontSize:12,minWidth:300}}><tbody>
        <tr><td style={{padding:"4px 10px"}}>Total pago a mais</td><td style={{padding:"4px 0",...pR,fontWeight:700,color:vCor(1)}}>+ {fB(mais)}</td></tr>
        <tr><td style={{padding:"4px 10px"}}>Total pago a menos</td><td style={{padding:"4px 0",...pR,fontWeight:700,color:vCor(-1)}}>− {fB(menos)}</td></tr>
        <tr><td style={{padding:"5px 10px",fontWeight:700,borderTop:"1px solid #333"}}>Saldo ({mais-menos>=0?"a mais":"a menos"})</td><td style={{padding:"5px 0",...pR,fontWeight:700,borderTop:"1px solid #333",color:Math.abs(mais-menos)<.005?"#111":vCor(mais-menos)}}>{mais-menos>=0?"+":"−"} {fB(Math.abs(mais-menos))}</td></tr>
      </tbody></table>
    </div>)}
  </ReportDoc>);
}
// Aba Relatórios

// Aba Inconsistências (só admin): seleção para impressão e marcação de tratadas
function Incons({ps,baixas,incOk,setIncOk,user,ajustes,setAjustes,am}){
  const all=useMemo(()=>findIncons(ps,baixas),[ps,baixas]);
  const[filtro,setFiltro]=useState("pend");const[sev,setSev]=useState("all");const[sel,setSel]=useState({});const[exp,setExp]=useState({});const[open,setOpen]=useState(false);
  const pend=all.filter(i=>!incOk[i.key]);const trat=all.filter(i=>incOk[i.key]);
  const list=(filtro==="pend"?pend:filtro==="trat"?trat:all).filter(i=>sev==="all"||i.sev===sev);
  // imprime só o que está selecionado e visível no filtro atual
  const selList=list.filter(i=>sel[i.key]);
  // ao abrir ou trocar de filtro, a lista exibida vem toda selecionada; marcar "Tratada" não mexe na seleção
  useEffect(()=>{setSel(Object.fromEntries(list.map(i=>[i.key,true])));},[filtro,sev]);
  const ajusteDe=k=>{for(const[m,l]of Object.entries(ajustes||{})){const x=(l||[]).find(x=>x.key===k);if(x)return{m,x};}return null;};
  const tirarAjuste=k=>setAjustes(a=>{const n={};Object.entries(a||{}).forEach(([m,l])=>{const r=(l||[]).filter(x=>x.key!==k);if(r.length)n[m]=r;});return n;});
  // reabrir um erro com ajuste lançado remove o ajuste junto (senão a fatura ficaria com o ajuste e o erro pendente)
  const toggleOk=i=>{const aj=ajusteDe(i.key);
    if(incOk[i.key]&&aj){if(!confirm(`Esta inconsistência tem ajuste lançado em ${aj.m} (${aj.x.valor>=0?"+":"−"} ${fB(Math.abs(aj.x.valor))}).\nAo reabrir, o ajuste sai da fatura de ${aj.m}. Continuar?`))return;tirarAjuste(i.key);}
    setIncOk(o=>{const n={...o};if(n[i.key])delete n[i.key];else n[i.key]={by:user?.email||"",ts:new Date().toISOString(),label:`${i.cat}: ${i.title}${aj?` (ajuste lançado em ${aj.m})`:""}`};return n;});};
  const removerAjuste=i=>{const aj=ajusteDe(i.key);if(!aj||!confirm(`Remover o ajuste de ${aj.m} (${aj.x.valor>=0?"+":"−"} ${fB(Math.abs(aj.x.valor))})?`))return;tirarAjuste(i.key);};
  const nErr=pend.filter(i=>i.sev==="Erro").length,nAt=pend.length-nErr;
  // Ajuste: leva o valor pago a mais/a menos da inconsistência para a fatura de um mês (pago a menos soma; pago a mais subtrai)
  const[ajMes,setAjMes]=useState(cmk());
  const jaAjustado=k=>Object.values(ajustes||{}).some(l=>(l||[]).some(x=>x.key===k));
  const ajSel=(()=>{const seen={};return selList.filter(i=>i.sev==="Erro"&&!incOk[i.key]&&!jaAjustado(i.key)).map(i=>({i,x:impactIncon(i,ps,baixas)})).filter(e=>e.x&&!seen[e.x.ref]&&(seen[e.x.ref]=1));})();
  const ajNet=ajSel.reduce((s,e)=>s-e.x.v,0);
  const lancarAjustes=()=>{if(!ajSel.length)return;
    if(!confirm(`Lançar ${ajSel.length} ajuste${ajSel.length>1?"s":""} na fatura de ${ajMes}?\nEfeito no total do mês: ${ajNet>=0?"+":"−"} ${fB(Math.abs(ajNet))}.\nAs inconsistências ficam marcadas como tratadas.`))return;
    const ts=new Date().toISOString();const by=user?.email||"";
    const novos=ajSel.map(({i,x})=>({key:i.key,desc:`${i.title} – ${x.v<0?"pago a menos":"pago a mais"}`,valor:Math.round(-x.v*100)/100,origem:i.cat,by,ts}));
    setAjustes(a=>({...a,[ajMes]:[...(a[ajMes]||[]),...novos]}));
    setIncOk(o=>{const n={...o};ajSel.forEach(({i})=>{n[i.key]={by,ts,label:`${i.cat}: ${i.title} (ajuste lançado em ${ajMes})`};});return n;});};
  const mesesAj=(()=>{const c=cmk();const s=new Set([...am,c]);const ci=MO.indexOf(c);for(let k=1;k<=3;k++)if(MO[ci+k])s.add(MO[ci+k]);return MO.filter(m=>s.has(m)&&MO.indexOf(m)>=ci).reverse();})();
  const card={background:Z.cd,border:`1px solid ${Z.bd}`,borderRadius:10,padding:16,marginBottom:18};
  const btn={background:`linear-gradient(135deg,${Z.ac3},${Z.ac2})`,color:"#fff",border:"none",borderRadius:6,padding:"7px 14px",fontSize:11,fontWeight:600,cursor:"pointer",fontFamily:Z.ft};
  const btn2={background:Z.cd2,color:Z.tx2,border:`1px solid ${Z.bd}`,borderRadius:6,padding:"7px 12px",fontSize:11,cursor:"pointer",fontFamily:Z.ft};
  const fmt=t=>new Date(t).toLocaleString("pt-BR",{day:"2-digit",month:"2-digit",year:"numeric",hour:"2-digit",minute:"2-digit"});
  return(<div style={card}>
    <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",gap:8,flexWrap:"wrap",marginBottom:8}}>
      <div style={{fontSize:12,fontWeight:600,color:Z.ac}}>Análise de inconsistências</div>
      <span style={{fontSize:11,color:Z.tx2}}>Pendentes: <span style={{color:nErr?Z.rd:Z.gn,fontWeight:600}}>{nErr} erro{nErr!==1?"s":""}</span> · <span style={{color:nAt?Z.yl:Z.gn,fontWeight:600}}>{nAt} atenção</span> · <span style={{color:Z.gn}}>{trat.length} tratada{trat.length!==1?"s":""}</span></span>
    </div>
    <div style={{fontSize:10,color:Z.tx3,marginBottom:12}}>Marque "Tratada" quando o caso estiver resolvido ou confirmado como correto: ele sai das contagens e do relatório, mas continua disponível no filtro "Tratadas". Use a caixa da esquerda para escolher o que imprimir.</div>
    <div style={{display:"flex",gap:6,flexWrap:"wrap",alignItems:"center",marginBottom:10}}>
      {[["pend",`Pendentes (${pend.length})`],["trat",`Tratadas (${trat.length})`],["all",`Todas (${all.length})`]].map(([v,l])=>(<button key={v} onClick={()=>setFiltro(v)} style={{...btn2,background:filtro===v?`${Z.ac3}30`:Z.cd2,color:filtro===v?Z.ac:Z.tx2}}>{l}</button>))}
      <select value={sev} onChange={e=>setSev(e.target.value)} style={{...btn2,color:sev==="Erro"?Z.rd:sev==="Atenção"?Z.yl:Z.tx2}}><option value="all">Erros e atenção</option><option value="Erro">Só erros</option><option value="Atenção">Só atenção</option></select>
      <span style={{flex:1}}/>
      <button onClick={()=>setSel(s=>{const n={...s};const allSel=list.every(i=>n[i.key]);list.forEach(i=>{if(allSel)delete n[i.key];else n[i.key]=true;});return n;})} style={btn2}>{list.length&&list.every(i=>sel[i.key])?"Desmarcar":"Selecionar"} todas da lista</button>
      <button disabled={!selList.length} onClick={()=>setOpen(true)} style={{...btn,opacity:selList.length?1:.4,cursor:selList.length?"pointer":"not-allowed"}}>Imprimir selecionadas ({selList.length})</button>
    </div>
    {ajSel.length>0&&<div style={{display:"flex",gap:8,alignItems:"center",flexWrap:"wrap",padding:"10px 12px",margin:"0 0 10px",background:`${Z.yl}12`,border:`1px solid ${Z.yl}50`,borderRadius:8,fontSize:11}}>
      <span style={{color:Z.tx}}>Lançar {ajSel.length} ajuste{ajSel.length>1?"s":""} (erros selecionados) na fatura de</span>
      <select value={ajMes} onChange={e=>setAjMes(e.target.value)} style={{...btn2,padding:"5px 8px"}}>{mesesAj.map(m=><option key={m} value={m}>{m}</option>)}</select>
      <span style={{fontFamily:Z.mn,fontWeight:700,color:ajNet>=0?Z.rd:Z.gn}}>{ajNet>=0?"+":"−"} {fB(Math.abs(ajNet))}</span>
      <button onClick={lancarAjustes} style={{...btn,padding:"6px 12px"}}>Lançar ajuste</button>
    </div>}
    {list.map(i=>{const ok=incOk[i.key];return(<div key={i.key} style={{display:"flex",gap:10,alignItems:"flex-start",padding:"9px 0",borderTop:`1px solid ${Z.bd}`,fontSize:11,opacity:ok?.6:1}}>
      <input type="checkbox" title="Selecionar para impressão" checked={!!sel[i.key]} onChange={()=>setSel(s=>({...s,[i.key]:!s[i.key]}))} style={{width:16,height:16,marginTop:1,accentColor:Z.ac2,flexShrink:0}}/>
      <div style={{flex:1,minWidth:0}}>
        <div style={{display:"flex",gap:6,alignItems:"center",flexWrap:"wrap"}}><span style={{fontSize:9,fontWeight:700,padding:"1px 6px",borderRadius:4,background:i.sev==="Erro"?`${Z.rd}25`:`${Z.yl}25`,color:i.sev==="Erro"?Z.rd:Z.yl}}>{i.sev}</span><span style={{color:Z.tx2}}>{i.cat}</span><span style={{marginLeft:"auto"}}><label style={{display:"flex",alignItems:"center",gap:5,fontSize:10,color:ok?Z.gn:Z.tx2,cursor:"pointer",whiteSpace:"nowrap",padding:"2px 0"}}><input type="checkbox" checked={!!ok} onChange={()=>toggleOk(i)} style={{width:15,height:15,accentColor:Z.gn}}/>Tratada</label></span></div>
        <div style={{marginTop:3,color:Z.tx,fontWeight:500}}>{i.title}</div><div style={{color:Z.tx2,marginTop:1}}>{i.detail}</div>
        <button onClick={()=>setExp(e=>({...e,[i.key]:!e[i.key]}))} style={{background:"none",border:"none",color:Z.ac,fontSize:10,padding:"3px 0 0",cursor:"pointer",fontFamily:Z.ft}}>{exp[i.key]?"▾ Ocultar análise":"▸ Ver análise"}</button>
        {exp[i.key]&&<div style={{marginTop:4,padding:"7px 9px",background:Z.cd2,borderLeft:`3px solid ${Z.ac3}`,borderRadius:4,color:Z.tx,fontSize:10.5,lineHeight:1.5}}>{explainIncon(i,ps,baixas)}</div>}
        {ok&&<div style={{color:Z.gn,fontSize:10,marginTop:3}}>Tratada em {fmt(ok.ts)}{ok.by?` por ${ok.by}`:""}</div>}
        {(()=>{const aj=ajusteDe(i.key);return aj&&<div style={{display:"flex",gap:8,alignItems:"center",flexWrap:"wrap",fontSize:10,marginTop:4,color:Z.yl}}><span>Ajuste lançado na fatura de {aj.m}: <b style={{color:vCor(-aj.x.valor)}}>{aj.x.valor>=0?"+":"−"} {fB(Math.abs(aj.x.valor))}</b></span><button onClick={()=>removerAjuste(i)} style={{...btn2,padding:"2px 8px",fontSize:10}}>Remover ajuste</button></div>;})()}
      </div>
    </div>);})}
    {!list.length&&<div style={{fontSize:11,color:Z.gn,padding:"8px 0"}}>{filtro==="trat"?"Nenhuma inconsistência tratada ainda.":"Nenhuma inconsistência pendente."}</div>}
    {open&&<PrintShell docName={pdfName("Relatório de Inconsistências",compInc(selList,ps))} onClose={()=>setOpen(false)}><IncSheet items={selList} {...{ps,baixas}}/></PrintShell>}
  </div>);
}

async function logAdmin(changes,who){

// Cada operação traz o valor esperado ("de"); se o registro mudou desde que o pacote foi preparado, ela fica em conflito.
const sameFields=(obj,de)=>obj&&Object.keys(de||{}).every(k=>JSON.stringify(obj[k])===JSON.stringify(de[k]));
function planCorrecao(pk,ps,baixas){
  let P=ps.map(p=>({...p}));const B=Object.fromEntries(Object.entries(baixas).map(([m,l])=>[m,l.map(x=>({...x}))]));
  const fmtC=c=>`${c.loja} (${fD(c.data)}) ${fB(c.total)} em ${c.parcelas}x`;const fmtB=b=>`${fB(b.amount)} em ${fD(b.date)}`;
  const itens=(pk.ops||[]).map(o=>{
    try{
      if(o.op==="compra.alterar"){const i=P.findIndex(p=>p.id===o.id);if(i<0||!sameFields(P[i],o.de))return{ok:false,txt:`Compra id ${o.id}`,erro:"registro diferente do esperado"};const antes=fmtC(P[i]);P[i]={...P[i],...o.para};return{ok:true,txt:`Alterar compra id ${o.id}`,antes,depois:fmtC(P[i])+(o.para.monthly?` · meses: ${Object.keys(o.para.monthly).join(", ")}`:"")};}
      if(o.op==="compra.incluir"){if(P.some(p=>p.id===o.compra.id))return{ok:false,txt:`Incluir compra id ${o.compra.id}`,erro:"já existe"};P.push(o.compra);return{ok:true,txt:"Incluir compra",depois:fmtC(o.compra)};}
      if(o.op==="compra.excluir"){const i=P.findIndex(p=>p.id===o.id);if(i<0||!sameFields(P[i],o.de))return{ok:false,txt:`Excluir compra id ${o.id}`,erro:"registro diferente do esperado"};const antes=fmtC(P[i]);P.splice(i,1);return{ok:true,txt:`Excluir compra id ${o.id}`,antes};}
      if(o.op==="loja.renomear"){const n=P.filter(p=>p.loja===o.de).length;if(!n)return{ok:false,txt:`Renomear loja ${o.de}`,erro:"nenhuma compra com esse nome"};P=P.map(p=>p.loja===o.de?{...p,loja:o.para}:p);return{ok:true,txt:`Renomear loja (${n} compra${n>1?"s":""})`,antes:o.de,depois:o.para};}
      if(o.op==="baixa.alterar"||o.op==="baixa.excluir"){const l=B[o.mes]||[];const i=l.findIndex(x=>sameFields(x,o.de));if(i<0)return{ok:false,txt:`Baixa de ${o.mes}`,erro:"baixa não encontrada como esperado"};const antes=fmtB(l[i]);
        if(o.op==="baixa.excluir"){l.splice(i,1);return{ok:true,txt:`Excluir baixa de ${o.mes}`,antes};}l[i]={...l[i],...o.para};return{ok:true,txt:`Alterar baixa de ${o.mes}`,antes,depois:fmtB(l[i])};}
      if(o.op==="baixa.incluir"){(B[o.mes]=B[o.mes]||[]).push(o.baixa);return{ok:true,txt:`Incluir baixa em ${o.mes}`,depois:fmtB(o.baixa)};}
      return{ok:false,txt:o.op,erro:"operação desconhecida"};
    }catch(e){return{ok:false,txt:o.op,erro:String(e.message||e)};}
  });
  return{itens,ok:itens.length>0&&itens.every(i=>i.ok),ps:P,baixas:B};
}

const HistCtx=React.createContext([]);

const dLoc=t=>{const d=new Date(t);return`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;};
const fmtTs=t=>new Date(t).toLocaleString("pt-BR",{day:"2-digit",month:"2-digit",year:"numeric",hour:"2-digit",minute:"2-digit"});
const H_TIPOS=[["compra","Compras"],["baixa","Baixas"],["ajuste","Ajustes"],["incons","Inconsistências"],["usuario","Usuários e perfis"],["correcao","Correções"],["outro","Outros"]];
function hTipo(t){return /compra/i.test(t)&&!/^Inconsist|^Ajuste/.test(t)?"compra":/baixa/i.test(t)&&!/^Inconsist|^Ajuste/.test(t)?"baixa":/^Ajuste/.test(t)?"ajuste":/^Inconsist/.test(t)?"incons":/^(Usuário|Perfil)/.test(t)?"usuario":/^Correç/.test(t)?"correcao":/ loja .* → /.test(t)?"compra":"outro";}
function hAcao(t){return /^(Nova|Novo|Ajuste lançado|Usuário incluído|Perfil incluído)/.test(t)?"Inclusão":/(excluíd|removid)/i.test(t)?"Exclusão":"Alteração";}
// uma linha por alteração, da mais recente para a mais antiga
const hLinhas=history=>{const out=[];[...history].reverse().forEach(h=>(h.changes||[]).forEach((c,k)=>out.push({ts:h.ts,user:h.user,txt:c,refs:(h.refs||[])[k]||null,tipo:hTipo(c),acao:hAcao(c)})));return out;};
// histórico de um registro: pelas referências gravadas e, nos lançamentos antigos (sem referência), pelo texto;
// uma alteração de baixa liga o valor novo ao antigo, então a busca segue a cadeia para trás
function hDoRegistro(history,keys,textos){const ks=new Set(keys);const out=[];

function maskMoney(v){
  let d=v.replace(/[^\d,]/g,"");
  const parts=d.split(",");
  if(parts.length>2)d=parts[0]+","+parts.slice(1).join("");
  if(parts.length===2&&parts[1].length>2)d=parts[0]+","+parts[1].slice(0,2);
  const intPart=d.split(",")[0].replace(/\D/g,"");
  const decPart=d.includes(",")?","+d.split(",")[1]:"";
  if(!intPart&&!decPart)return"";
  const formatted=intPart.replace(/\B(?=(\d{3})+(?!\d))/g,".");
  return formatted+decPart;
}
function parseMoney(v){const n=v.replace(/\./g,"").replace(",",".");const f=parseFloat(n);return isNaN(f)?0:f;}
function maskInt(v){const d=v.replace(/\D/g,"");return d===""?"":String(Math.max(1,Math.min(48,parseInt(d)||1)));}
function isValidDate(v){if(!v||v.length!==10)return false;const[dd,mm,yy]=v.split("/");const d=parseInt(dd),m=parseInt(mm),y=parseInt(yy);if(isNaN(d)||isNaN(m)||isNaN(y))return false;if(m<1||m>12||d<1||d>31||y<2020||y>2040)return false;const dt=new Date(y,m-1,d);return dt.getFullYear()===y&&dt.getMonth()===m-1&&dt.getDate()===d;}

// Interpreta o texto lido de um comprovante (compra no cartão ou pagamento/baixa)
const nrmTxt=s=>s.normalize("NFD").replace(/[̀-ͯ]/g,"").toUpperCase();
function parseReceipt(text,kind,lojas){
  const lines=text.split(/\r?\n/).map(l=>l.trim()).filter(Boolean);const U=lines.map(nrmTxt);
  const out={};
  // valores: 1.234,56 | 1234,56 | 1234.56 (OCR às vezes troca vírgula por ponto)
  const moneyRe=/(?:R\$|RS|R5)?\s*(\d{1,3}(?:[.\s]\d{3})*[,.]\d{2}|\d+[,.]\d{2})(?!\d)/g;
  const toNum=s=>{s=s.replace(/\s/g,"");const m=s.match(/^(.*)[,.](\d{2})$/);return m?parseFloat(m[1].replace(/[.,]/g,"")+"."+m[2]):NaN;};
  const vals=(i)=>[...lines[i].matchAll(moneyRe)].map(m=>toNum(m[1])).filter(v=>v>0&&v<1e7);
  const kwTot=kind==="baixa"?/(VALOR\s*(DO\s*)?(PAGAMENTO|PAGO|TOTAL|DA TRANSFERENCIA|DO PIX)?|TOTAL\s*PAGO|VALOR)/:/(VALOR\s*TOTAL|TOTAL\s*(DA COMPRA|GERAL|A PAGAR)?|VALOR\s*(DA COMPRA|APROVADO)?|VLR)/;
  let valor=null;
  for(let i=0;i<U.length&&valor==null;i++){if(kwTot.test(U[i])&&!/PARCELA|TROCO|DESCONTO|TAXA|JUROS/.test(U[i])){let v=vals(i);if(!v.length&&i+1<lines.length)v=vals(i+1);if(v.length)valor=v[v.length-1];}}
  if(valor==null){const all=lines.flatMap((_,i)=>vals(i));if(all.length)valor=Math.max(...all);}
  if(valor!=null)out.valor=Math.round(valor*100)/100;
  // data: dd/mm/aaaa, dd/mm/aa, dd.mm.aaaa, dd-mm-aaaa e por extenso ("19 out 2026", "19/OUT/26", "15 de outubro de 2026")
  const kwData=kind==="baixa"?/(PAGAMENTO|PAGO EM|REALIZAD|EFETUAD|DATA)/:/(DATA|EMISSAO|COMPRA)/;
  const dRe=/(\d{2})\s?[\/.\-]\s?(\d{2})\s?[\/.\-]\s?(\d{4}|\d{2})(?!\d)/;
  const MES3=["JAN","FEV","MAR","ABR","MAI","JUN","JUL","AGO","SET","OUT","NOV","DEZ"];

      </div>
    </div>
  </div>);
}

function Ppl({ppl,setPpl,isAdmin}){
  const[ex,setEx]=useState(null);
  const[addPay,setAddPay]=useState(null); // {person,itemIdx}
  const[payMonth,setPayMonth]=useState("");
  const[payAmt,setPayAmt]=useState("");
  const[payDate,setPayDate]=useState("");
  const[payErr,setPayErr]=useState({});

  const tp=Object.values(ppl).flat().reduce((s,i)=>s+i.payments.reduce((a,p)=>a+p.amount,0),0);
  const tr=Object.values(ppl).flat().reduce((s,i)=>s+(i.remaining||0),0);

  const addPayment=(person,itemIdx)=>{
    const e={};
    if(!payMonth.trim())e.month="Informe o mês";
    const amt=parseMoney(payAmt);
    if(!payAmt||amt<=0)e.amt="Valor inválido";
    if(!payDate)e.date="Informe a data";
    else if(!isValidDate(payDate))e.date="Data inválida";
    setPayErr(e);
    if(Object.keys(e).length>0)return;

    setPpl(prev=>{
      const updated={...prev};
      const items=[...updated[person]];
      const item={...items[itemIdx]};
      const newPayments=[...item.payments,{month:payMonth.trim(),amount:amt,date:payDate}];
      const totalPaid=newPayments.reduce((s,p)=>s+p.amount,0);
      item.payments=newPayments;
      item.remaining=Math.max(0,Math.round((item.total-totalPaid)*100)/100);
      items[itemIdx]=item;
      updated[person]=items;
      return updated;
    });
    setAddPay(null);setPayMonth("");setPayAmt("");setPayDate("");setPayErr({});
  };

  const is={width:"100%",background:Z.cd2,border:`1px solid ${Z.bd}`,borderRadius:5,padding:"6px 8px",color:Z.tx,fontSize:11,boxSizing:"border-box",fontFamily:Z.ft};
  const ie={...is,borderColor:Z.rd};
  const eS={fontSize:8,color:Z.rd,marginTop:1};

  return(<div>
    <div style={{display:"flex",gap:10,marginBottom:18,flexWrap:"wrap"}}><St label="Total Pago" value={fB(tp)} color={Z.gn}/><St label="Restante" value={fB(tr)} color={tr>0?Z.yl:Z.gn}/></div>
    {Object.entries(ppl).map(([n,its])=>{const pp=its.reduce((s,i)=>s+i.payments.reduce((a,p)=>a+p.amount,0),0);const pr=its.reduce((s,i)=>s+(i.remaining||0),0);const isEx=ex===n;
    return(<div key={n} style={{background:Z.cd,border:`1px solid ${Z.bd}`,borderRadius:10,marginBottom:8,overflow:"hidden"}}>
      <div onClick={()=>setEx(isEx?null:n)} style={{padding:"12px 16px",cursor:"pointer",display:"flex",alignItems:"center",justifyContent:"space-between"}}>
        <div style={{display:"flex",alignItems:"center",gap:9}}><div style={{width:36,height:36,borderRadius:"50%",background:pr===0?Z.gn:`linear-gradient(135deg,${Z.ac3},${Z.ac2})`,display:"flex",alignItems:"center",justifyContent:"center",fontSize:14,fontWeight:700,color:"#fff"}}>{n.charAt(0)}</div><div><div style={{fontSize:13,fontWeight:600}}>{n}</div><div style={{fontSize:10,color:Z.tx3}}>{its.length} {its.length===1?"item":"itens"}</div></div></div>
        <div style={{textAlign:"right"}}><div style={{fontSize:12,fontWeight:600,fontFamily:Z.mn,color:pr===0?Z.gn:Z.yl}}>{pr===0?"Quitado ✓":fB(pr)}</div><div style={{fontSize:9,color:Z.tx3}}>Pago: {fB(pp)}</div></div>
      </div>
      {isEx&&its.map((it,idx)=>{
        const itemPaid=it.payments.reduce((s,p)=>s+p.amount,0);
        const isAddingHere=addPay&&addPay.person===n&&addPay.itemIdx===idx;
        return(<div key={idx} style={{padding:"9px 16px",borderTop:`1px solid ${Z.bd}`,animation:"fi .15s ease"}}>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:5}}>
          <span style={{fontSize:12,fontWeight:600,color:Z.ac}}>{it.item}</span>
          <div style={{display:"flex",alignItems:"center",gap:8}}>
            <span style={{fontSize:12,fontFamily:Z.mn}}>{fB(it.total)}</span>
          </div>
        </div>
        <table style={{width:"100%",fontSize:10,borderCollapse:"collapse"}}><thead><tr style={{color:Z.tx3}}><th style={{textAlign:"left",padding:"3px 0"}}>Mês</th><th style={{textAlign:"right",padding:"3px 0"}}>Valor</th><th style={{textAlign:"right",padding:"3px 0"}}>Data</th></tr></thead><tbody>{it.payments.map((p,i)=>(<tr key={i} style={{borderTop:`1px solid ${Z.bd}`}}><td style={{padding:"3px 0"}}>{p.month}</td><td style={{padding:"3px 0",textAlign:"right",fontFamily:Z.mn,color:Z.gn}}>{fB(p.amount)}</td><td style={{padding:"3px 0",textAlign:"right",color:Z.tx3}}>{fD(p.date)}</td></tr>))}</tbody></table>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginTop:6,paddingTop:6,borderTop:`1px solid ${Z.bd2}`}}>
          <div style={{fontSize:10}}><span style={{color:Z.tx3}}>Pago: {fB(itemPaid)}</span><span style={{color:Z.tx3,margin:"0 6px"}}>·</span><span style={{color:it.remaining===0?Z.gn:Z.yl,fontWeight:600}}>Resta: {fB(it.remaining)}</span></div>
          {isAdmin&&it.remaining>0&&!isAddingHere&&<button onClick={()=>{setAddPay({person:n,itemIdx:idx});setPayMonth("");setPayAmt("");setPayDate("");setPayErr({});}} style={{background:`${Z.ac3}30`,color:Z.ac,border:`1px solid ${Z.ac3}50`,borderRadius:5,padding:"4px 10px",fontSize:9,fontWeight:600,cursor:"pointer"}}>+ Baixa</button>}
        </div>
        {isAddingHere&&(<div style={{marginTop:8,padding:10,background:Z.cd2,borderRadius:8,border:`1px solid ${Z.bd2}`,animation:"fi .15s ease"}}>
          <div style={{fontSize:10,fontWeight:600,color:Z.ac,marginBottom:8}}>Nova Baixa — {it.item}</div>
          <div className="g3t">
            <div><label style={{fontSize:8,color:Z.tx3,display:"block",marginBottom:1}}>Mês/Ref.</label><input value={payMonth} onChange={e=>{setPayMonth(e.target.value);setPayErr(p=>({...p,month:undefined}));}} placeholder="Ex: Março/2026" style={payErr.month?ie:is}/>{payErr.month&&<div style={eS}>{payErr.month}</div>}</div>
            <div><label style={{fontSize:8,color:Z.tx3,display:"block",marginBottom:1}}>Valor (R$)</label>
              <div style={{position:"relative"}}><span style={{position:"absolute",left:6,top:"50%",transform:"translateY(-50%)",fontSize:9,color:Z.tx3}}>R$</span><input value={payAmt} onChange={e=>{setPayAmt(maskMoney(e.target.value));setPayErr(p=>({...p,amt:undefined}));}} placeholder="0,00" inputMode="decimal" style={{...(payErr.amt?ie:is),paddingLeft:22}}/></div>
              {payErr.amt&&<div style={eS}>{payErr.amt}</div>}
            </div>
            <div><label style={{fontSize:8,color:Z.tx3,display:"block",marginBottom:1}}>Data Pgto</label><input value={payDate} onChange={e=>{setPayDate(maskDate(e.target.value));setPayErr(p=>({...p,date:undefined}));}} placeholder="dd/MM/aaaa" maxLength={10} inputMode="numeric" style={payErr.date?ie:is}/>{payErr.date&&<div style={eS}>{payErr.date}</div>}</div>
          </div>
          <div style={{display:"flex",gap:5,marginTop:8,justifyContent:"flex-end"}}>
            <button onClick={()=>setAddPay(null)} style={{background:Z.bd,color:Z.tx3,border:"none",borderRadius:4,padding:"5px 12px",fontSize:9,cursor:"pointer"}}>Cancelar</button>
            <button onClick={()=>addPayment(n,idx)} style={{background:`linear-gradient(135deg,${Z.ac3},${Z.ac2})`,color:"#fff",border:"none",borderRadius:4,padding:"5px 12px",fontSize:9,fontWeight:600,cursor:"pointer"}}>Registrar Baixa</button>
          </div>
        </div>)}
      </div>);})}
    </div>);})}
  </div>);
}

function BaixasView({baixas,setBaixas,mt,am,isAdmin}){
  const[selM,setSelM]=useState(cmk());

  const[bAmt,setBAmt]=useState("");

  const[bErr,setBErr]=useState({});
  const[editIdx,setEditIdx]=useState(null);
  const[editAmt,setEditAmt]=useState("");
  const[editDate,setEditDate]=useState("");

  const mBx=baixas[selM]||[];
  const totalBx=mBx.reduce((s,b)=>s+b.amount,0);
  const prov=mt[selM]||0;
  const saldoMes=totalBx-prov;

  // Saldo acumulado para o mês selecionado
  const calcAcum=(targetM)=>{
    if(SEED_ACUM[targetM]!==undefined){
      return SEED_ACUM[targetM];
    }
    const lastSeedM="Fevereiro/2026";
    const lsi=MO.indexOf(lastSeedM);
    const ti=MO.indexOf(targetM);
    if(ti<=lsi)return 0;
    let a=SEED_ACUM[lastSeedM]||0;
    for(let i=lsi+1;i<=ti;i++){
      const m=MO[i];if(!m)break;
      const p=mt[m]||0;
      const tb=(baixas[m]||[]).reduce((s,b)=>s+b.amount,0);
      a+=(tb-p);
    }
    return Math.round(a*100)/100;
  };
  const saldoAcum=calcAcum(selM);

  const addBx=async()=>{
    if(bBusy)return;const e={};

    if(Object.keys(e).length>0)return;
    let anexos=null;if(bFile){setBBusy(true);try{anexos=[await saveAnexo(bFile,currentUser(),{tipo:"baixa",mes:selM,data:bDate})];}catch(er){setBBusy(false);if(!salvarSemAnexo(er,"a baixa"))return;}setBBusy(false);}
    setBaixas(prev=>{const u={...prev};u[selM]=[...(u[selM]||[]),{amount:amt,date:bDate,...(anexos?{anexos}:{})}];return u;});
    setBAmt("");setBDate("");setShowAdd(false);setBErr({});setBFile(null);
  };

  const remBx=(idx)=>{setBaixas(prev=>{const u={...prev};const l=[...(u[selM]||[])];l.splice(idx,1);u[selM]=l;return u;});};
  const startEdit=(idx)=>{const b=mBx[idx];setEditIdx(idx);setEditAmt(maskMoney(b.amount.toFixed(2).replace(".",",")));setEditDate(b.date?fD(b.date):"");};
  const cancelEdit=()=>{setEditIdx(null);setEditAmt("");setEditDate("");};
  const saveEdit=()=>{const amt=parseMoney(editAmt);if(amt<=0)return;const dt=editDate&&editDate.length===10&&isValidDate(editDate)?editDate:null;setBaixas(prev=>{const u={...prev};const l=[...(u[selM]||[])];l[editIdx]={...l[editIdx],amount:amt,date:dt||l[editIdx].date};u[selM]=l;return u;});cancelEdit();};

  // Histórico: ignorar os 4 primeiros meses (sem dados), ordenar desc
  const skipMonths=new Set(["Abril/2023","Maio/2023","Junho/2023","Julho/2023"]);
  const allBxMonths=am.filter(m=>!skipMonths.has(m)&&((mt[m]||0)>0||(baixas[m]&&baixas[m].length>0))).reverse();

  const is={width:"100%",background:Z.cd2,border:`1px solid ${Z.bd}`,borderRadius:5,padding:"7px 9px",color:Z.tx,fontSize:11,boxSizing:"border-box",fontFamily:Z.ft};
  const ie={...is,borderColor:Z.rd};
  const eS={fontSize:8,color:Z.rd,marginTop:1};

  return(<div>
    <div className="stat-row" style={{display:"flex",gap:10,flexWrap:"wrap",marginBottom:18}}>
      <St label="Provisão do Mês" value={fB(prov)} color={Z.ac}/>
      <St label="Baixas do Mês" value={fB(totalBx)} sub={`${mBx.length} pagamento${mBx.length!==1?"s":""}`} color={Z.gn}/>
      <St label="Saldo do Mês" value={fB(saldoMes)} sub={saldoMes>=0?"Superávit":"Déficit"} color={saldoMes>=0?Z.gn:Z.yl}/>
      <St label="Saldo Acumulado" value={fB(saldoAcum)} sub={saldoAcum>=0?"Quitado":"Devedor"} color={saldoAcum>=0?Z.gn:Z.rd}/>
    </div>

    {/* Seletor de mês + registro */}
    <div style={{background:Z.cd,border:`1px solid ${Z.bd}`,borderRadius:10,padding:16,marginBottom:18}}>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:12,flexWrap:"wrap",gap:8}}>
        <div style={{display:"flex",alignItems:"center",gap:8,flexWrap:"wrap"}}>
          <div style={{fontSize:12,fontWeight:600,color:Z.ac}}>Baixas</div>
          <select value={selM} onChange={e=>{setSelM(e.target.value);setShowAdd(false);}} style={{background:Z.cd2,color:Z.tx,border:`1px solid ${Z.bd}`,borderRadius:6,padding:"5px 8px",fontSize:11,fontFamily:Z.ft,cursor:"pointer"}}>{[...am].reverse().map(m=><option key={m} value={m}>{m}</option>)}</select>
        </div>
        {isAdmin&&!showAdd&&<button onClick={()=>{setShowAdd(true);setBAmt("");setBDate("");setBErr({});}} style={{background:`linear-gradient(135deg,${Z.ac3},${Z.ac2})`,color:"#fff",border:"none",borderRadius:6,padding:"6px 14px",fontSize:10,fontWeight:600,cursor:"pointer"}}>+ Nova Baixa</button>}
      </div>

      {isAdmin&&showAdd&&(<div style={{padding:12,background:Z.cd2,borderRadius:8,border:`1px solid ${Z.bd2}`,marginBottom:12,animation:"fi .15s ease"}}>
        <div style={{fontSize:10,fontWeight:600,color:Z.ac,marginBottom:8}}>Registrar Baixa — {selM}</div>
        <ScanButton kind="baixa" onFile={setBFile} onResult={r=>{if(r.valor)setBAmt(moneyTxt(r.valor));if(r.data)setBDate(r.data);setBErr({});}}/>
        <div className="g3f">
          <div><label style={{fontSize:9,color:Z.tx3,display:"block",marginBottom:2}}>Valor (R$)</label>
            <div style={{position:"relative"}}><span style={{position:"absolute",left:7,top:"50%",transform:"translateY(-50%)",fontSize:10,color:Z.tx3}}>R$</span><input value={bAmt} onChange={e=>{setBAmt(maskMoney(e.target.value));setBErr(p=>({...p,amt:undefined}));}} placeholder="0,00" inputMode="decimal" style={{...(bErr.amt?ie:is),paddingLeft:24}}/></div>
            {bErr.amt&&<div style={eS}>{bErr.amt}</div>}
          </div>
          <div><label style={{fontSize:9,color:Z.tx3,display:"block",marginBottom:2}}>Data do Pagamento</label>
            <input value={bDate} onChange={e=>{setBDate(maskDate(e.target.value));setBErr(p=>({...p,date:undefined}));}} placeholder="dd/MM/aaaa" maxLength={10} inputMode="numeric" style={bErr.date?ie:is}/>
            {bErr.date&&<div style={eS}>{bErr.date}</div>}
          </div>
          <div style={{display:"flex",gap:4}}>
            <button onClick={addBx} style={{background:`linear-gradient(135deg,${Z.ac3},${Z.ac2})`,color:"#fff",border:"none",borderRadius:5,padding:"7px 14px",fontSize:10,fontWeight:600,cursor:"pointer"}}>Registrar</button>
            <button onClick={()=>setShowAdd(false)} style={{background:Z.bd,color:Z.tx3,border:"none",borderRadius:5,padding:"7px 8px",fontSize:10,cursor:"pointer"}}>✕</button>
          </div>
        </div>
      </div>)}

      {/* Baixas do mês selecionado */}
      {mBx.length>0?(<table style={{width:"100%",fontSize:11,borderCollapse:"collapse"}}>

        <tbody>{mBx.map((b,i)=>editIdx===i&&isAdmin?(<tr key={i} style={{borderTop:`1px solid ${Z.bd}`,background:`${Z.ac3}10`}}>
          <td style={{padding:"4px 0",color:Z.tx3}}>{i+1}</td>
          <td style={{padding:"4px 0",textAlign:"right"}}><div style={{position:"relative",display:"inline-block"}}><span style={{position:"absolute",left:4,top:"50%",transform:"translateY(-50%)",fontSize:9,color:Z.tx3}}>R$</span><input value={editAmt} onChange={e=>setEditAmt(maskMoney(e.target.value))} inputMode="decimal" style={{background:Z.cd2,border:`1px solid ${Z.bd}`,borderRadius:4,padding:"4px 4px 4px 22px",color:Z.tx,fontSize:10,width:100,fontFamily:Z.mn,boxSizing:"border-box"}}/></div></td>
          <td style={{padding:"4px 0",textAlign:"right"}}><input value={editDate} onChange={e=>setEditDate(maskDate(e.target.value))} maxLength={10} inputMode="numeric" placeholder="dd/MM/aaaa" style={{background:Z.cd2,border:`1px solid ${Z.bd}`,borderRadius:4,padding:"4px 6px",color:Z.tx,fontSize:10,width:90,textAlign:"right",boxSizing:"border-box"}}/></td>
          <td style={{padding:"4px 0",textAlign:"center",whiteSpace:"nowrap"}}><button onClick={saveEdit} style={{background:Z.gn,color:"#fff",border:"none",borderRadius:3,padding:"3px 6px",fontSize:9,cursor:"pointer",marginRight:2}}>✓</button><button onClick={cancelEdit} style={{background:Z.bd,color:Z.tx3,border:"none",borderRadius:3,padding:"3px 6px",fontSize:9,cursor:"pointer"}}>✕</button></td>
        </tr>):(<tr key={i} style={{borderTop:`1px solid ${Z.bd}`,cursor:isAdmin?"pointer":"default"}} onDoubleClick={()=>isAdmin&&startEdit(i)}>
          <td style={{padding:"6px 0",color:Z.tx3}}>{i+1}</td>
          <td style={{padding:"6px 0",textAlign:"right",fontFamily:Z.mn,color:Z.gn,fontWeight:600}}>{fB(b.amount)}</td>

          <td style={{padding:"6px 0",textAlign:"center"}}>{isAdmin&&<button onClick={()=>remBx(i)} style={{background:"none",border:"none",color:Z.rd,fontSize:11,cursor:"pointer",padding:"2px 4px"}}>✕</button>}</td>
        </tr>))}</tbody>

        </tr></tfoot>

    </div>

    {/* Histórico completo */}
    <div style={{background:Z.cd,border:`1px solid ${Z.bd}`,borderRadius:10,padding:16}}>
      <div style={{fontSize:12,fontWeight:600,color:Z.ac,marginBottom:14}}>Histórico de Baixas</div>

                <td style={{padding:"6px 0",textAlign:"center"}}>{tb===0&&p===0?"":<>{isQuitado?<span style={{color:Z.gn,fontSize:9,fontWeight:600}}>✓ Quitado</span>:tb>0?<span style={{color:Z.yl,fontSize:9}}>Parcial</span>:<span style={{color:Z.rd,fontSize:9}}>Pendente</span>}</>}</td>
              </tr>);
            });
          })()}</tbody>
        </table>
      </div>
    </div>
  </div>);

function Rpts({ps,mt,am}){
  const mx=Math.max(...Object.values(mt),1);
  const sr=useMemo(()=>{const m={};ps.forEach(p=>{m[p.loja]=(m[p.loja]||0)+p.total;});return Object.entries(m).sort((a,b)=>b[1]-a[1]);},[ps]);
  return(<div>
    <div style={{background:Z.cd,border:`1px solid ${Z.bd}`,borderRadius:10,padding:18,marginBottom:18}}>
      <div style={{fontSize:11,fontWeight:600,color:Z.ac,marginBottom:12}}>Histórico Completo</div>
      <div className="chart-wrap" style={{display:"flex",alignItems:"flex-end",gap:1,height:160,overflowX:"auto",paddingBottom:20}}>
        {am.filter(m=>mt[m]>0).map(m=>{const v=mt[m]||0;const h=Math.max(3,(v/mx)*140);const p=pmk(m);return(<div key={m} style={{display:"flex",flexDirection:"column",alignItems:"center",minWidth:18,flex:"0 0 auto"}}><span style={{fontSize:6,color:Z.tx3,marginBottom:1,fontFamily:Z.mn}}>{v>999?`${(v/1e3).toFixed(0)}k`:""}</span><div style={{width:14,height:h,background:`linear-gradient(180deg,${Z.ac2},${Z.ac3}80)`,borderRadius:"2px 2px 1px 1px"}} title={`${m}: ${fB(v)}`}/><span style={{fontSize:6,color:Z.tx3,marginTop:1,writingMode:"vertical-rl",transform:"rotate(180deg)",height:32}}>{p?`${MS[p.month]}/${String(p.year).slice(2)}`:""}</span></div>);})}
      </div>
    </div>
    <div className="g2">
      <div style={{background:Z.cd,border:`1px solid ${Z.bd}`,borderRadius:10,padding:16}}><div style={{fontSize:11,fontWeight:600,color:Z.ac,marginBottom:12}}>Ranking Lojas</div><div style={{maxHeight:360,overflowY:"auto"}}>{sr.map(([l,t],i)=>(<div key={l} style={{marginBottom:7}}><div style={{display:"flex",justifyContent:"space-between",fontSize:10,marginBottom:2}}><span><span style={{color:Z.tx3,marginRight:4}}>{i+1}.</span>{l}</span><span style={{fontFamily:Z.mn,color:Z.ac}}>{fB(t)}</span></div><div style={{height:3,background:Z.bd,borderRadius:1}}><div style={{height:"100%",background:`hsl(${265-i*6},65%,${58-i}%)`,borderRadius:1,width:`${(t/sr[0][1])*100}%`}}/></div></div>))}</div></div>
      <div style={{background:Z.cd,border:`1px solid ${Z.bd}`,borderRadius:10,padding:16}}><div style={{fontSize:11,fontWeight:600,color:Z.ac,marginBottom:12}}>Resumo Geral</div>
        {[["Total Compras",ps.length.toString()],["Valor Total",fB(ps.reduce((s,p)=>s+p.total,0))],["Lojas",new Set(ps.map(p=>p.loja)).size.toString()],["Ticket Médio",fB(ps.reduce((s,p)=>s+p.total,0)/ps.length)],["Maior Compra",fB(Math.max(...ps.map(p=>p.total)))],["Média Parcelas",(ps.reduce((s,p)=>s+p.parcelas,0)/ps.length).toFixed(1)+"x"]].map(([l,v])=>(<div key={l} style={{display:"flex",justifyContent:"space-between",padding:"7px 0",borderBottom:`1px solid ${Z.bd}`,fontSize:11}}><span style={{color:Z.tx3}}>{l}</span><span style={{fontWeight:600,fontFamily:Z.mn}}>{v}</span></div>))}
      </div>
    </div>
  </div>);
}
